# Plex Tier Manager with PostgreSQL. Copy .env.example to .env, fill it in, then:  docker compose up -d
# Run it where it can reach Tautulli, and where Tautulli can reach it (for the webhook): e.g. next to Plex.
services:
  ptm:
    image: ptm:latest
    build: .
    container_name: ptm
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ptm}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-ptm}
    ports:
      - "${PTM_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    container_name: ptm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ptm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ptm}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
